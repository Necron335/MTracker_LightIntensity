mtracker:
  ros__parameters:
    serial_port: /dev/serial/by-id/usb-FTDI_Single_RS232-HS-if00-port0
    baud_rate: 921600
    command_type: 6
    robot_address: 256  # 0x0100, mask used by the previous driver
    wheel_base: 0.15
    wheel_radius: 0.025
    command_timeout: 0.5
    odometry_command_repetitions: 3
    odometry_command_delay_ms: 50
    odometry_topic: /wheel/odom
    odom_frame: odom
    base_frame: base_link
    pose_sigma_x: 0.01
    pose_sigma_y: 0.01
    pose_sigma_theta: 0.02
    twist_sigma_linear: 0.02
    twist_sigma_angular: 0.03
